name = "escala-natal-gm"
main = "src/index.js"
compatibility_date = "2025-09-01"

[vars]
# Domínio do front na Vercel (ex.: "https://escala-natal-gm.vercel.app"). "*" libera qualquer origem.
ALLOWED_ORIGIN = "*"

[[d1_databases]]
binding = "DB"
database_name = "escala-natal-gm"
# Cole aqui o id que aparece ao rodar: npx wrangler d1 create escala-natal-gm
database_id = "c77a3e79-8414-4ac3-874b-73099c49d591"
migrations_dir = "migrations"

# Senha do coordenador (NÃO fica no git). Defina com:
#   npx wrangler secret put ADMIN_KEY
