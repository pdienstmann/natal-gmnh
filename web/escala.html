<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Escala em Tempo Real · HE Natal</title>
  <meta name="description" content="Escala de hora extra do Natal 2026 em tempo real, por dia e horário — GM Novo Hamburgo.">
  <meta name="theme-color" content="#0d2418">
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --pine-900: #0b1f15; --pine-800: #0d2418; --pine-600: #1d4a33; --pine-500: #2f6b4b;
      --red-600: #b3202a; --red-100: #fbe4e4; --green-100: #e7efe9;
      --gold-500: #d9a93c; --gold-300: #f0cf7a;
      --bg: #f4f1ea; --paper: #fffdf8; --ink: #1d2620; --ink-soft: #5c6b62; --line: #e3dccb;
      --radius: 12px;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { -webkit-text-size-adjust: 100%; }
    body { margin: 0; font-family: "Inter", system-ui, sans-serif; color: var(--ink); background: var(--bg); }
    button { font: inherit; cursor: pointer; }

    header {
      background: var(--pine-800); color: #fbf7ee; padding: 14px 16px;
      position: sticky; top: 0; z-index: 5; box-shadow: 0 4px 14px rgba(0,0,0,.18);
    }
    .bar { max-width: 1200px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
    .brand { flex: 1 1 260px; min-width: 0; }
    .brand h1 { margin: 0; font-family: "Fraunces", Georgia, serif; font-size: 21px; }
    .brand p { margin: 2px 0 0; font-size: 12.5px; color: var(--gold-300); display: flex; align-items: center; gap: 6px; }
    .live { width: 8px; height: 8px; border-radius: 50%; background: #5bd38a; box-shadow: 0 0 0 0 rgba(91,211,138,.7); animation: pulse 2s infinite; }
    .live.off { background: #ff8a8a; animation: none; }
    @keyframes pulse { 70% { box-shadow: 0 0 0 7px rgba(91,211,138,0); } 100% { box-shadow: 0 0 0 0 rgba(91,211,138,0); } }
    @media (prefers-reduced-motion: reduce) { .live { animation: none; } }

    .controls { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .btn {
      border: 1.5px solid rgba(255,255,255,.3); background: transparent; color: #fbf7ee;
      padding: 7px 12px; border-radius: 9px; font-weight: 600; font-size: 14px;
    }
    .btn:hover { background: rgba(255,255,255,.08); }
    .btn.on { background: var(--gold-500); border-color: var(--gold-500); color: var(--pine-900); }
    select.btn { appearance: none; padding-right: 28px; background-image: linear-gradient(45deg, transparent 50%, #fbf7ee 50%), linear-gradient(135deg, #fbf7ee 50%, transparent 50%); background-position: calc(100% - 15px) 50%, calc(100% - 10px) 50%; background-size: 5px 5px; background-repeat: no-repeat; }
    select.btn option { color: var(--ink); }

    main { max-width: 1200px; margin: 0 auto; padding: 18px 16px 40px; }

    .day { background: var(--paper); border-radius: var(--radius); box-shadow: 0 2px 10px rgba(0,0,0,.07); margin-bottom: 18px; overflow: hidden; break-inside: avoid; }
    .day-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; padding: 12px 16px; color: #fff; background: var(--pine-600); }
    .day.weekend .day-head { background: var(--red-600); }
    .day-head h2 { margin: 0; font-size: 20px; font-family: "Fraunces", Georgia, serif; }
    .day-head .meta { font-size: 13.5px; opacity: .95; }
    .day-head .meta b { font-variant-numeric: tabular-nums; }
    .day-head .hoje { background: var(--gold-500); color: var(--pine-900); font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; letter-spacing: .04em; }
    .progress { height: 5px; background: rgba(0,0,0,.08); }
    .progress div { height: 100%; background: var(--gold-500); }

    .groups { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; }
    .group { border-right: 1px solid var(--line); min-width: 0; }
    .group:last-child { border-right: 0; }
    .group h3 { margin: 0; padding: 9px 12px; font-size: 14px; display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px solid var(--line); }
    .group.folga h3 { background: var(--red-100); color: var(--red-600); }
    .group.ext h3 { background: var(--green-100); color: var(--pine-600); }
    .group h3 small { font-weight: 600; opacity: .85; white-space: nowrap; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    td { padding: 6px 10px; border-bottom: 1px dashed var(--line); vertical-align: top; }
    tr:last-child td { border-bottom: 0; }
    td.n { width: 30px; text-align: right; color: var(--ink-soft); font-size: 12px; font-variant-numeric: tabular-nums; }
    td.mat { width: 1%; white-space: nowrap; color: var(--ink-soft); font-variant-numeric: tabular-nums; text-align: right; }
    td.nome { word-break: break-word; font-weight: 500; }
    .vazio { padding: 12px; color: #a59e8e; font-style: italic; font-size: 13px; }
    @media (max-width: 760px) { .groups { grid-template-columns: 1fr; } .group { border-right: 0; border-bottom: 1px solid var(--line); } .group:last-child { border-bottom: 0; } }

    .msg { text-align: center; color: var(--ink-soft); padding: 40px 10px; }

    @media print {
      @page { size: A4; margin: 12mm; }
      body { background: #fff; }
      header { position: static; box-shadow: none; background: #fff; color: var(--ink); padding: 0 0 8px; border-bottom: 2px solid var(--ink); }
      .brand p { color: var(--ink-soft); }
      .controls, .live { display: none !important; }
      main { padding: 10px 0 0; }
      .day { box-shadow: none; border: 1px solid #999; }
      .day-head, .group h3 { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .groups { grid-template-columns: repeat(3, 1fr) !important; }
      .group { border-right: 1px solid #ccc !important; border-bottom: 0 !important; }
    }
  </style>
</head>
<body>
  <header>
    <div class="bar">
      <div class="brand">
        <h1>📋 Escala HE Natal · Tempo real</h1>
        <p><span class="live" id="live"></span><span id="status">Carregando…</span></p>
      </div>
      <div class="controls">
        <button class="btn" id="prev" title="Dia anterior" aria-label="Dia anterior">‹</button>
        <select class="btn" id="dia" aria-label="Escolher dia"></select>
        <button class="btn" id="next" title="Próximo dia" aria-label="Próximo dia">›</button>
        <button class="btn" id="hoje">Hoje</button>
        <button class="btn" id="amanha">Amanhã</button>
        <button class="btn" id="todos">Todos os dias</button>
        <button class="btn" id="imprimir">🖨️ Imprimir</button>
      </div>
    </div>
  </header>

  <main id="conteudo"><p class="msg">Carregando escala…</p></main>

  <script src="escala.js"></script>
</body>
</html>
